<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>练习 · 小围棋</title>
<link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<div id="shell"></div>
<div class="wrap">
  <h1>🎯 闯关练习</h1>
  <p class="muted">每课三道小题，做对一道得一颗 ⭐。点"第 N 关"直接开始。</p>
  <div id="levels"></div>

  <h2>🔁 错题重练</h2>
  <div class="card">
    <p class="muted" id="wrongTip">做错的题会自动收进这里，做对 2 次就毕业。</p>
    <div id="wrongBox"></div>
    <button class="btn btn-green btn-big" id="wrongStart" style="display:none;margin-top:10px">开始重练错题</button>
  </div>
</div>
<footer>小围棋 · 幼儿围棋陪学</footer>

<script src="../assets/js/engine.js"></script>
<script src="../data/curriculum.js"></script>
<script src="../data/explain.js"></script>
<script src="../data/tricks.js"></script>
<script src="../data/trickmap.js"></script>
<script src="../assets/js/board.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/quiz.js"></script>
<script>
(function () {
  WQ.shell('exercises');
  var C = window.WQ_CURRICULUM;
  var box = document.getElementById('levels');

  C.forEach(function (l, i) {
    var stars = WQ.Progress.stars(l.id);
    var row = document.createElement('div');
    row.className = 'card';
    var html = '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="font-size:26px">' + l.emoji + '</div>' +
      '<div style="flex:1"><b>第' + (i + 1) + '课 ' + l.title + '</b>' +
      '<div class="stars">' + stars.map(function (v) { return v ? '⭐' : '<span class="dim">☆</span>'; }).join('') + '</div></div></div>' +
      '<div class="level-row"></div>';
    row.innerHTML = html;
    var lr = row.querySelector('.level-row');
    [0, 1, 2].forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'level-btn' + (stars[k] ? ' done' : '');
      b.innerHTML = '<span class="lv">' + ['🥉', '🥈', '🥇'][k] + '</span>第 ' + (k + 1) + ' 关' + (stars[k] ? ' ✅' : '');
      b.onclick = function () {
        location.href = '../lesson/index.html?id=' + l.id + '&q=' + k + '#quizBox';
      };
      lr.appendChild(b);
    });
    box.appendChild(row);
  });

  /* 错题重练 */
  var wrong = WQ.Progress.wrongList();
  var items = [];
  wrong.forEach(function (w) {
    var p = WQ.parseQid(w.id);
    var l = C.find(function (x) { return x.id === p.lessonId; });
    if (!l || !l.quiz[p.index]) return;
    var q = Object.create(l.quiz[p.index]);
    q.__index = p.index;
    q.__lessonId = l.id;
    q.__title = l.title;
    items.push(q);
  });
  var tip = document.getElementById('wrongTip');
  var btn = document.getElementById('wrongStart');
  if (!items.length) {
    tip.textContent = '太棒了，现在没有错题！做错的题会自动收进这里。';
  } else {
    tip.textContent = '还有 ' + items.length + ' 道错题，做完它们就都是满分啦。';
    btn.style.display = '';
    btn.textContent = '开始重练（' + items.length + ' 道）';
    btn.onclick = function () {
      btn.style.display = 'none';
      WQQuiz.mount(document.getElementById('wrongBox'), {
        lesson: { id: 'wrong', quiz: items, title: '错题' }, questions: items
      });
    };
  }
})();
</script>
</body>
</html>
